<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>JETZACUBE Wireframes</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e9e9e9;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #e9e9e9;
    }

    #frame {
      position: relative;
      display: inline-block;
      width: auto;
      height: 100dvh;
      max-width: 100vw;
      line-height: 0;
    }

    #frame img {
      display: block;
      height: 100dvh;
      width: auto;
      max-width: 100vw;
      max-height: 100dvh;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
    }

    .hotspot {
      position: absolute;
      border: none;
      background: transparent;
      margin: 0;
      padding: 0;
      cursor: pointer;
      z-index: 20;
      touch-action: manipulation;
    }

    .hotspot:focus {
      outline: none;
    }

    .titulo-interno {
      position: absolute;
      top: 7.5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(255, 255, 255, 0.92);
      color: #111;
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      max-width: 74%;
      line-height: 1.2;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .btn-back {
      position: absolute;
      top: 7.3%;
      left: 5%;
      z-index: 35;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      color: #111;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-back.oculto {
      display: none;
    }

    @media (max-width: 480px) {
      .titulo-interno {
        top: 7%;
        font-size: 14px;
        padding: 9px 14px;
        max-width: 76%;
      }

      .btn-back {
        top: 6.8%;
        left: 4.8%;
        width: 38px;
        height: 38px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="frame">
      <img id="imagen" src="pantallas/01.png" alt="Pantalla wireframe" />
      <div id="overlay"></div>

      <button id="btnBack" class="btn-back oculto" onclick="retroceder()">←</button>
      <div id="tituloInterno" class="titulo-interno">INICIO</div>
    </div>
  </div>

  <script>
    let actual = 1;
    const historial = [];

    const nombres = {
      1: "INICIO",
      2: "CREAR CUENTA TUTOR",
      3: "ACEPTAR TÉRMINOS DE PRIVACIDAD",
      4: "INICIAR SESIÓN",
      5: "RECUPERAR CONTRASEÑA",
      6: "VALIDACIÓN DE CÓDIGO",
      7: "NUEVA CONTRASEÑA",
      8: "INICIAR SESIÓN",
      9: "PERFIL TUTOR",
      10: "PERFIL NIÑO",
      11: "SINCRONIZACIÓN",
      12: "CONEXIÓN DE DISPOSITIVOS",
      13: "INICIO APLICACIÓN",
      14: "GENERAR REPORTE",
      15: "INFORME DEL PROGRESO",
      16: "DESCARGA PDF",
      17: "HISTORIAL",
      18: "AJUSTES"
    };

    /*
      Coordenadas mejor ajustadas:
      x = izquierda
      y = arriba
      w = ancho
      h = alto
    */

    const mapa = {
      1: [
        { x: 23, y: 50.5, w: 54, h: 5.8, destino: 2, label: "Crear cuenta" },
        { x: 40, y: 60.8, w: 20, h: 3.6, destino: 4, label: "Iniciar sesión" }
      ],

      2: [
        { x: 26, y: 74.8, w: 48, h: 3.8, destino: 3, label: "Aceptar términos de privacidad" },
        { x: 22, y: 86.2, w: 56, h: 7.0, destino: 3, label: "Continuar crear cuenta" }
      ],

      3: [
        { x: 22, y: 84.7, w: 56, h: 7.0, destino: 4, label: "Aceptar privacidad y continuar" }
      ],

      4: [
        { x: 36, y: 60.6, w: 29, h: 3.2, destino: 5, label: "Olvidaste tu contraseña" },
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 9, label: "Botón iniciar sesión" }
      ],

      5: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 6, label: "Enviar recuperación" }
      ],

      6: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 7, label: "Validar código" }
      ],

      7: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 8, label: "Guardar nueva contraseña" }
      ],

      8: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 9, label: "Entrar a perfil tutor" }
      ],

      9: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 10, label: "Guardar perfil tutor" }
      ],

      10: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 11, label: "Guardar perfil niño" }
      ],

      11: [
        { x: 28, y: 72.6, w: 44, h: 5.8, destino: 12, label: "Sincronizar" }
      ],

      12: [
        { x: 16.5, y: 74.0, w: 19.5, h: 5.8, destino: 11, label: "Regresar sincronización" },
        { x: 63.5, y: 74.0, w: 19.5, h: 5.8, destino: 13, label: "Conectar dispositivo" }
      ],

      13: [
        { x: 29.0, y: 53.2, w: 10.0, h: 6.5, destino: 14, label: "Cuadro reporte 1" },
        { x: 43.8, y: 53.2, w: 10.0, h: 6.5, destino: 17, label: "Cuadro historial 1" },
        { x: 58.8, y: 53.2, w: 10.0, h: 6.5, destino: 18, label: "Cuadro ajustes 1" },

        { x: 29.0, y: 63.6, w: 10.0, h: 6.5, destino: 14, label: "Cuadro reporte 2" },
        { x: 43.8, y: 63.6, w: 10.0, h: 6.5, destino: 17, label: "Cuadro historial 2" },
        { x: 58.8, y: 63.6, w: 10.0, h: 6.5, destino: 18, label: "Cuadro ajustes 2" },

        { x: 26.5, y: 78.0, w: 47.5, h: 5.8, destino: 14, label: "Botón principal continuar" }
      ],

      14: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 15, label: "Generar reporte" }
      ],

      15: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 16, label: "Ir a descarga PDF" }
      ],

      16: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 13, label: "Continuar desde PDF" }
      ],

      17: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 13, label: "Continuar historial" }
      ],

      18: [
        { x: 22, y: 73.0, w: 56, h: 7.0, destino: 13, label: "Guardar ajustes y volver" }
      ]
    };

    const imagen = document.getElementById("imagen");
    const overlay = document.getElementById("overlay");
    const titulo = document.getElementById("tituloInterno");
    const btnBack = document.getElementById("btnBack");

    function irA(numero, guardarHistorial = true) {
      if (numero < 1 || numero > 18) return;

      if (guardarHistorial && actual !== numero) {
        historial.push(actual);
      }

      actual = numero;
      titulo.textContent = nombres[numero];

      const archivo = String(numero).padStart(2, "0");
      imagen.src = "pantallas/" + archivo + ".png";

      if (historial.length > 0) {
        btnBack.classList.remove("oculto");
      } else {
        btnBack.classList.add("oculto");
      }
    }

    function retroceder() {
      if (historial.length === 0) return;
      const anterior = historial.pop();
      actual = anterior;
      titulo.textContent = nombres[anterior];

      const archivo = String(anterior).padStart(2, "0");
      imagen.src = "pantallas/" + archivo + ".png";

      if (historial.length > 0) {
        btnBack.classList.remove("oculto");
      } else {
        btnBack.classList.add("oculto");
      }
    }

    function crearHotspots() {
      overlay.innerHTML = "";
      const zonas = mapa[actual] || [];

      zonas.forEach(zona => {
        const btn = document.createElement("button");
        btn.className = "hotspot";
        btn.type = "button";
        btn.setAttribute("aria-label", zona.label || "botón");
        btn.title = zona.label || "";

        btn.style.left = zona.x + "%";
        btn.style.top = zona.y + "%";
        btn.style.width = zona.w + "%";
        btn.style.height = zona.h + "%";

        btn.addEventListener("click", () => {
          irA(zona.destino, true);
        });

        overlay.appendChild(btn);
      });
    }

    imagen.addEventListener("load", () => {
      crearHotspots();
    });

    window.addEventListener("resize", () => {
      crearHotspots();
    });

    irA(1, false);
  </script>
</body>
</html>
