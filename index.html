<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JETZACUBE Wireframes</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e9e9e9;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .phone-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pantalla {
      position: relative;
      width: auto;
      height: 100vh;
      max-width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pantalla img {
      height: 100vh;
      width: auto;
      max-width: 100vw;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .hotspot {
      position: absolute;
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      z-index: 20;
    }

    .hotspot:focus {
      outline: none;
    }

    .titulo-interno {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(255,255,255,0.88);
      color: #111;
      padding: 10px 18px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      max-width: 78%;
      line-height: 1.2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .btn-back {
      position: absolute;
      top: 12%;
      left: 8%;
      z-index: 35;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      color: #111;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      cursor: pointer;
    }

    .btn-back.oculto {
      display: none;
    }

    @media (max-width: 480px) {
      .titulo-interno {
        top: 11%;
        font-size: 15px;
        padding: 9px 14px;
        max-width: 74%;
      }

      .btn-back {
        top: 11%;
        left: 7%;
        width: 38px;
        height: 38px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="phone-wrapper">
      <div class="pantalla" id="pantalla">
        <img id="imagen" src="pantallas/01.png" alt="Pantalla wireframe" />
        <div class="overlay" id="overlay"></div>

        <button id="btnBack" class="btn-back oculto" onclick="retroceder()">←</button>
        <div id="tituloInterno" class="titulo-interno">INICIO</div>
      </div>
    </div>
  </div>

  <script>
    let actual = 1;
    const historial = [];

    const nombres = {
      1: "INICIO",
      2: "CREAR CUENTA TUTOR",
      3: "ACEPTAR TÉRMINOS DE PRIVACIDAD",
      4: "INICIAR SESIÓN",
      5: "RECUPERAR CONTRASEÑA",
      6: "VALIDACIÓN DE CÓDIGO",
      7: "NUEVA CONTRASEÑA",
      8: "INICIAR SESIÓN",
      9: "PERFIL TUTOR",
      10: "PERFIL NIÑO",
      11: "SINCRONIZACIÓN",
      12: "CONEXIÓN DE DISPOSITIVOS",
      13: "INICIO APLICACIÓN",
      14: "GENERAR REPORTE",
      15: "INFORME DEL PROGRESO",
      16: "DESCARGA PDF",
      17: "HISTORIAL",
      18: "AJUSTES"
    };

    /* 
      Coordenadas en porcentaje relativas a la imagen completa:
      x = left
      y = top
      w = width
      h = height
    */
    const mapa = {
      1: [
        { x: 15, y: 58, w: 70, h: 8, destino: 2 },
        { x: 33, y: 69, w: 34, h: 6, destino: 4 }
      ],

      2: [
        { x: 20, y: 76, w: 60, h: 5, destino: 3 },
        { x: 18, y: 86, w: 64, h: 9, destino: 3 }
      ],

      3: [
        { x: 18, y: 85, w: 64, h: 9, destino: 4 }
      ],

      4: [
        { x: 30, y: 61, w: 40, h: 4, destino: 5 },
        { x: 18, y: 79, w: 64, h: 9, destino: 9 }
      ],

      5: [
        { x: 18, y: 79, w: 64, h: 9, destino: 6 }
      ],

      6: [
        { x: 18, y: 79, w: 64, h: 9, destino: 7 }
      ],

      7: [
        { x: 18, y: 79, w: 64, h: 9, destino: 8 }
      ],

      8: [
        { x: 18, y: 79, w: 64, h: 9, destino: 9 }
      ],

      9: [
        { x: 18, y: 79, w: 64, h: 9, destino: 10 }
      ],

      10: [
        { x: 18, y: 79, w: 64, h: 9, destino: 11 }
      ],

      11: [
        { x: 18, y: 79, w: 64, h: 9, destino: 12 }
      ],

      12: [
        { x: 14, y: 78, w: 30, h: 8, destino: 11 },
        { x: 56, y: 78, w: 30, h: 8, destino: 13 }
      ],

      13: [
        { x: 21, y: 56, w: 14, h: 9, destino: 14 },
        { x: 42, y: 56, w: 14, h: 9, destino: 17 },
        { x: 63, y: 56, w: 14, h: 9, destino: 18 },

        { x: 21, y: 67, w: 14, h: 9, destino: 14 },
        { x: 42, y: 67, w: 14, h: 9, destino: 17 },
        { x: 63, y: 67, w: 14, h: 9, destino: 18 },

        { x: 18, y: 82, w: 64, h: 8, destino: 14 }
      ],

      14: [
        { x: 18, y: 79, w: 64, h: 9, destino: 15 }
      ],

      15: [
        { x: 18, y: 79, w: 64, h: 9, destino: 16 }
      ],

      16: [
        { x: 18, y: 79, w: 64, h: 9, destino: 13 }
      ],

      17: [
        { x: 18, y: 79, w: 64, h: 9, destino: 13 }
      ],

      18: [
        { x: 18, y: 79, w: 64, h: 9, destino: 13 }
      ]
    };

    function irA(numero, guardarHistorial = true) {
      if (numero < 1 || numero > 18) return;

      if (guardarHistorial && actual !== numero) {
        historial.push(actual);
      }

      actual = numero;

      const archivo = String(numero).padStart(2, "0");
      document.getElementById("imagen").src = "pantallas/" + archivo + ".png";
      document.getElementById("tituloInterno").textContent = nombres[numero];

      const btnBack = document.getElementById("btnBack");
      if (historial.length > 0) {
        btnBack.classList.remove("oculto");
      } else {
        btnBack.classList.add("oculto");
      }

      crearHotspots();
    }

    function retroceder() {
      if (historial.length === 0) return;
      const anterior = historial.pop();
      irA(anterior, false);
    }

    function crearHotspots() {
      const overlay = document.getElementById("overlay");
      overlay.innerHTML = "";

      const botones = mapa[actual] || [];

      botones.forEach((zona) => {
        const b = document.createElement("button");
        b.className = "hotspot";
        b.style.left = zona.x + "%";
        b.style.top = zona.y + "%";
        b.style.width = zona.w + "%";
        b.style.height = zona.h + "%";
        b.onclick = () => irA(zona.destino, true);
        overlay.appendChild(b);
      });
    }

    irA(1, false);
  </script>
</body>
</html>
